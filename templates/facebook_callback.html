<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook Pages</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .page {
            padding: 15px;
            margin-top: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .page-name {
            font-size: 18px;
            font-weight: bold;
        }

        .page-id {
            margin-top: 5px;
            color: #666;
            font-size: 14px;
        }

        .empty {
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Facebook Pages</h1>

        {% if pages %}

            {% for page in pages %}

                <div class="page">

                    <div class="page-name">
                        {{ page.name }}
                    </div>

                    <div class="page-id">
                        Page ID: {{ page.id }}
                    </div>

                </div>

            {% endfor %}

        {% else %}

            <p class="empty">
                No Facebook Pages were found.
            </p>

        {% endif %}

    </div>

</body>
</html>
